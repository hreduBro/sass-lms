@if (user(); as user) {
  <div (click)="onClose()" class="fixed inset-0 !m-0 top-0 left-0 right-0 bottom-0 w-screen h-screen bg-black/60 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 sm:p-6 overflow-y-auto animate-fade-in">
    <div (click)="onModalClick($event)" class="relative w-full max-w-lg p-8 m-4 rounded-2xl bg-glass-bg border border-glass-border shadow-2xl animate-scale-in">
      <button (click)="onClose()" class="absolute top-4 right-4 p-2 text-text-secondary hover:text-text-primary rounded-full hover:bg-base-300 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <div class="flex flex-col items-center text-center">
        <img class="h-24 w-24 rounded-full border-4 border-glass-border" [src]="'https://i.pravatar.cc/100?u=' + user.email" alt="User Avatar">
        <h2 class="mt-4 text-2xl font-bold text-text-primary">{{ user.name }}</h2>
        <p class="text-sm text-text-secondary">{{ user.email }}</p>
      </div>

      <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">
        <div class="p-4 rounded-lg bg-base-200/50">
          <label class="text-xs font-semibold text-text-secondary uppercase">User ID</label>
          <p class="mt-1 font-mono text-text-primary">{{ user.id }}</p>
        </div>
        <div class="p-4 rounded-lg bg-base-200/50">
          <label class="text-xs font-semibold text-text-secondary uppercase">Joined Date</label>
          <p class="mt-1 font-medium text-text-primary">{{ user.joinDate }}</p>
        </div>
        <div class="p-4 rounded-lg bg-base-200/50">
          <label class="text-xs font-semibold text-text-secondary uppercase">Plan</label>
          <div class="mt-1">
             <span class="px-2 inline-flex leading-5 font-semibold rounded-full" [class]="planColorMap[user.plan]">
              {{ user.plan }}
            </span>
          </div>
        </div>
        <div class="p-4 rounded-lg bg-base-200/50">
          <label class="text-xs font-semibold text-text-secondary uppercase">Status</label>
           <div class="mt-1">
            <span class="px-2 inline-flex leading-5 font-semibold rounded-full" [class]="statusColorMap[user.status]">
              {{ user.status }}
            </span>
          </div>
        </div>
        <div class="sm:col-span-2 p-4 rounded-lg bg-base-200/50">
          <label class="text-xs font-semibold text-text-secondary uppercase">Credit Balance</label>
          <p class="mt-1 text-lg font-bold text-brand-primary">{{ user.creditBalance | number }} credits</p>
        </div>
      </div>
      
      <div class="mt-8 flex justify-end space-x-3">
        <button class="px-4 py-2 text-sm font-semibold rounded-lg text-text-secondary bg-base-300 hover:bg-base-300/80 transition-colors">
          Manage
        </button>
        <button (click)="onClose()" class="px-4 py-2 text-sm font-semibold rounded-lg text-white bg-brand-primary hover:bg-brand-primary/80 transition-colors">
          Done
        </button>
      </div>
    </div>
  </div>
}

<style>
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes scale-in {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  .animate-fade-in {
    animation: fade-in 0.2s ease-out forwards;
  }
  .animate-scale-in {
    animation: scale-in 0.2s ease-out forwards;
  }
</style>
