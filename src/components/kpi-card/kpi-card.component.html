<div class="p-5 rounded-2xl bg-base-100 border border-base-300 shadow-sm hover:shadow transition-shadow flex flex-col justify-between">
  <div class="flex items-center justify-between mb-3">
    <span class="text-xs font-semibold text-text-secondary uppercase tracking-wider">{{ resolvedData().title }}</span>
    <div class="w-9 h-9 rounded-xl bg-tenant-50 dark:bg-tenant-500/20 text-tenant-700 dark:text-tenant-200 border border-tenant-500/20 flex items-center justify-center">
      <span class="material-symbols-outlined text-lg">{{ iconMap[resolvedData().icon] || 'analytics' }}</span>
    </div>
  </div>

  <div class="flex items-baseline justify-between mt-1">
    <span class="text-2xl font-bold text-text-primary tracking-tight font-sans">{{ resolvedData().value }}</span>
    
    <div class="flex items-center gap-1 text-xs font-medium" 
         [class]="isPositiveChange() ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'">
      <span class="material-symbols-outlined text-sm">
        {{ isPositiveChange() ? 'arrow_upward' : 'arrow_downward' }}
      </span>
      <span>{{ resolvedData().change }}</span>
    </div>
  </div>

  @if (resolvedData().subtext) {
    <div class="mt-2 pt-2 border-t border-base-300/50 text-[11px] text-text-secondary">
      {{ resolvedData().subtext }}
    </div>
  }
</div>
